# Site settings
title: OpenSourceFeed
description: >-
  Open source software directory and alternatives guide.
  Find free and open source software for Linux, Windows, and macOS.
url: "https://www.opensourcefeed.org"
baseurl: "/software"
main_site_url: "https://www.opensourcefeed.org"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude theme gem (we use custom layouts)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - docs

# SASS configuration
sass:
  style: compressed
  load_paths:
    - _sass

# Collections
collections:
  softwares:
    output: true
    permalink: /:slug/
  alternatives:
    output: true
    permalink: /alternative-to/:slug/
  roundups:
    output: true
    permalink: /best-open-source-:slug/

# Defaults — auto-assign layouts based on path
defaults:
  - scope:
      path: ""      # all files
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""      # all files in softwares collection
      type: "softwares"
    values:
      layout: "software"
  - scope:
      path: ""      # all files in alternatives collection
      type: "alternatives"
    values:
      layout: "alternative-to"
  - scope:
      path: ""      # all files in roundups collection
      type: "roundups"
    values:
      layout: "roundup"

# AdSense configuration
# Slot IDs map descriptive position keys (used in {% include ad.html slot="..." %})
# to numeric AdSense ad unit IDs. Same slot ID may be reused across different
# page types, but must NOT appear more than once on the same page.
adsense:
  enabled: true
  client_id: "ca-pub-6380671811722843"
  slots:
    software-below-header: "2834641343"       # Article: top (software + alternatives pages)
    software-mid-content: "5417552591"        # Article: mid (software + alternatives pages)
    alternatives-below-header: "2834641343"   # Reuses top-of-article slot
    alternatives-mid-content: "5417552591"    # Reuses mid-article slot
    directory-below-title: "3888848509"       # Landing pages (directory + alt landing)
    alt-landing-below-title: "3888848509"     # Reuses landing slot
    roundup-below-header: "2834641343"        # Reuses top-of-article slot
    roundup-mid-content: "5417552591"         # Reuses mid-article slot
    roundup-landing-below-title: "3888848509" # Reuses landing slot

# Analytics configuration
google_analytics:
  enabled: true
  measurement_id: "G-KD5NJYRYD3"

ahrefs_analytics:
  enabled: true
  api_key: "CtE+TXWgN05s3ROalk1xUg"

