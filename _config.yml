# License identifier -> canonical license text URL (used in json-ld-software.html
# and the software page's "Is X open source?" answer). Keep `license` values in
# _softwares/ to these keys or Proprietary / Source-available.
license_urls:
  GPL-2.0: "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
  GPL-2.0-or-later: "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
  GPL-3.0: "https://www.gnu.org/licenses/gpl-3.0.html"
  GPL-3.0-or-later: "https://www.gnu.org/licenses/gpl-3.0.html"
  LGPL-2.0-or-later: "https://www.gnu.org/licenses/old-licenses/lgpl-2.0.html"
  LGPL-2.1-or-later: "https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html"
  LGPL-3.0: "https://www.gnu.org/licenses/lgpl-3.0.html"
  AGPL-3.0: "https://www.gnu.org/licenses/agpl-3.0.html"
  AGPL-3.0-or-later: "https://www.gnu.org/licenses/agpl-3.0.html"
  MIT: "https://opensource.org/licenses/MIT"
  Apache-2.0: "https://www.apache.org/licenses/LICENSE-2.0"
  BSD-2-Clause: "https://opensource.org/licenses/BSD-2-Clause"
  BSD-3-Clause: "https://opensource.org/licenses/BSD-3-Clause"
  MPL-2.0: "https://www.mozilla.org/en-US/MPL/2.0/"

