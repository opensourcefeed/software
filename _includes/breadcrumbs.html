<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ul>
    <li><a href="{{ site.main_site_url }}">Home</a></li>
    <li aria-hidden="true">›</li>
    <li><a href="{{ '/' | relative_url }}">Software</a></li>
    {% if page.layout == "alternative-to" or page.url contains "/alternative-to/" %}
      <li aria-hidden="true">›</li>
      <li><a href="{{ '/alternative-to/' | relative_url }}">Alternative To</a></li>
    {% endif %}
    <li aria-hidden="true">›</li>
    <li aria-current="page">{{ page.title }}</li>
  </ul>
</nav>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ site.main_site_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Software",
      "item": {{ '/' | absolute_url | jsonify }}
    }
    {% if page.layout == "alternative-to" or page.url contains "/alternative-to/" %}
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": "Alternative To",
      "item": {{ '/alternative-to/' | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 4,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% else %}
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
    {% endif %}
  ]
}
</script>
