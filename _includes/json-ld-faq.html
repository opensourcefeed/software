{% comment %}
  FAQPage JSON-LD, emitted alongside the page's primary schema whenever
  page.faq (list of {question, answer}) is set. See _includes/faq-section.html
  for the matching visible rendering — keep both in sync with page.faq.
{% endcomment %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}
    {
      "@type": "Question",
      "name": {{ item.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.answer | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
